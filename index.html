<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><meta name="robots" content="noindex,nofollow"><title>PPT Pest OS — Owner Preview</title>
<style>:root{--k:#050505;--g:#666;--l:#d7d7d7;--s:#f4f4f4}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff}button,select,input,textarea{font:inherit}button{background:#fff;border:1px solid #111;border-radius:6px;padding:10px 12px;font-weight:800;cursor:pointer}.primary{background:#000;color:#fff}.top{height:68px;position:sticky;top:0;z-index:10;background:#fff;border-bottom:3px solid #000;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand b{font-size:25px;letter-spacing:-1px}.brand span{font-size:9px;letter-spacing:2px;margin-left:10px}.top-right{display:flex;align-items:center;gap:9px}.top-right span{font-size:10px;font-weight:800}.top select{padding:9px;border:1px solid #000;border-radius:5px;background:#fff}.layout{display:grid;grid-template-columns:170px 1fr;min-height:calc(100vh - 68px)}aside{border-right:1px solid #000;padding:20px 12px;display:flex;flex-direction:column;gap:4px}aside small{font-size:9px;letter-spacing:1.5px;font-weight:800;color:#666;margin:2px 8px 9px}aside button{border:0;text-align:left}aside button.on{background:#000;color:#fff}main{padding:26px 30px;min-width:0}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:2px solid #000;padding-bottom:12px;margin-bottom:18px}.head h1{font-size:31px;line-height:1;margin:0;letter-spacing:-1.2px}.head p{font-size:12px;color:#555;margin:6px 0 0}.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:42px;align-items:center;padding:20px 0 26px}.eyebrow{font-size:9px;font-weight:900;letter-spacing:1.8px}.hero h2{font-size:56px;line-height:.9;letter-spacing:-3.5px;margin:10px 0 18px}.hero p{font-size:16px;line-height:1.55;max-width:520px}.jumps{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.diagram{border:1px solid #000;padding:20px}.office{border:2px solid #000;text-align:center;padding:17px;display:grid;gap:3px}.office small{letter-spacing:1.3px;font-weight:900}.office b{font-size:23px}.stem{height:28px;width:2px;background:#000;margin:auto}.trucks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.trucks div{border:1px solid #000;text-align:center;padding:14px 6px;display:grid;gap:3px}.trucks span{font-size:9px}.values{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #000;margin:10px 0 0}.values div{padding:14px;border-right:1px solid #000;display:grid;gap:3px}.values div:last-child{border-right:0}.values b{font-size:21px}.values span{font-size:8px;letter-spacing:1px;font-weight:900;color:#555}.features{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #000;border-top:0}.features article{padding:16px;border-right:1px solid #000}.features article:last-child{border-right:0}.features h3{font-size:15px;margin:10px 0 6px}.features p{font-size:11px;line-height:1.5;margin:0}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.lane{border:1px solid #000;min-height:430px}.lane header{background:#000;color:#fff;padding:10px;font-size:10px;font-weight:900;letter-spacing:.8px;display:flex;justify-content:space-between}.cards{padding:8px;display:grid;gap:7px}.card{border:1px solid #000;border-radius:5px;padding:8px;text-align:left;display:grid;gap:3px;background:#fff}.card strong{font-size:11px}.card span,.card small{font-size:9px}.done{background:repeating-linear-gradient(-45deg,#fff,#fff 6px,#eee 6px,#eee 12px)}.done strong{text-decoration:line-through}.daily{display:grid;grid-template-columns:2.1fr 1fr;border:1px solid #000}.hours{border-right:1px solid #000}.label{font-size:9px;letter-spacing:1.3px;font-weight:900;padding:8px 10px;border-bottom:1px solid #000}.hour{min-height:56px;display:grid;grid-template-columns:78px 1fr;border-bottom:1px solid #ddd}.hour:last-child{border-bottom:0}.hour time{font-size:11px;font-weight:900;padding:12px 9px;border-right:1px solid #ddd}.hour>div{padding:5px}.notes textarea{border:0;width:100%;height:690px;padding:13px;resize:none;outline:none;background:repeating-linear-gradient(#fff,#fff 31px,#e2e2e2 32px)}.weekdays,.month{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays{background:#000;color:#fff}.weekdays b{text-align:center;padding:7px;font-size:9px}.month{border-left:1px solid #000;border-top:1px solid #000}.day{min-height:105px;border-right:1px solid #000;border-bottom:1px solid #000;padding:5px}.day>time{display:block;text-align:right;font-size:9px;font-weight:900}.mini{border-bottom:1px solid #ddd;padding:4px 1px;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{border:1px solid #000;padding:14px}.panel h2{font-size:11px;letter-spacing:1px;border-bottom:1px solid #000;padding-bottom:7px;margin:0 0 12px}.panel label{display:grid;gap:5px;font-size:9px;font-weight:800;margin-bottom:9px}.panel input,.panel textarea,.panel select{border:1px solid #aaa;border-radius:4px;padding:9px;background:#fff}.panel textarea{min-height:75px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #000}.metric{padding:18px;border-right:1px solid #000}.metric:last-child{border-right:0}.metric b{font-size:30px}.metric span{display:block;font-size:8px;letter-spacing:1px;font-weight:900}.truckstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.truckstats article{border:1px solid #000;padding:15px}.bottom{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:18px 14px 82px}.top{padding:0 12px}.brand span,.top-right span{display:none}.hero{grid-template-columns:1fr}.hero h2{font-size:48px}.values,.features{grid-template-columns:1fr 1fr}.values div:nth-child(2){border-right:0}.values div:nth-child(-n+2){border-bottom:1px solid #000}.features article:nth-child(2){border-right:0}.features article:nth-child(-n+2){border-bottom:1px solid #000}.board{grid-template-columns:repeat(2,1fr)}.record{grid-template-columns:1fr}.bottom{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:2px solid #000;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;border-radius:0;padding:13px 2px;font-size:9px}.bottom button.on{background:#000;color:#fff}}@media(max-width:620px){.head{display:grid;grid-template-columns:1fr;align-items:start}.head>button{width:100%;white-space:nowrap}.top{height:58px}.brand b{font-size:20px}.hero h2{font-size:42px}.hero p{font-size:14px}.jumps{display:grid}.values,.features{grid-template-columns:1fr 1fr}.board{grid-template-columns:1fr}.daily{grid-template-columns:1fr}.hours{border-right:0}.notes{border-top:2px solid #000}.notes textarea{height:240px}.monthwrap{overflow-x:auto}.weekdays,.month{min-width:720px}.metrics{grid-template-columns:1fr 1fr}.truckstats{grid-template-columns:1fr}.head h1{font-size:25px}}</style></head>
<body><div id="app"></div><script>
const today='2026-09-09',jobs=[{id:'j1',c:'Canyon Oaks HOA',a:'Chino Hills, CA',t:1,time:'08:00',s:'Rodent Inspection',st:'scheduled',amt:285},{id:'j2',c:'Inland Retail Center',a:'Ontario, CA',t:2,time:'10:30',s:'Recurring Commercial',st:'in_progress',amt:420},{id:'j3',c:'Riverwalk Country Club',a:'San Diego, CA',t:3,time:'13:00',s:'Gopher / Wildlife',st:'scheduled',amt:450},{id:'j4',c:'Pinecrest Apartments',a:'Rancho Cucamonga, CA',t:0,time:'',s:'Bed Bug Inspection',st:'review_needed',amt:0},{id:'j5',c:'Mesa Logistics',a:'Fontana, CA',t:1,time:'07:00',s:'Warehouse IPM',st:'completed',amt:350}];let view='overview',role='office',selected=null;const A=document.getElementById('app');const names={office:'Office / Dispatch',truck1:'Truck 1',truck2:'Truck 2',truck3:'Truck 3'};const nav=['Overview','Dispatch','Daily','Monthly','Jobs','Reports'];
function visible(){let t=role==='office'?0:+role.replace('truck','');return role==='office'?jobs:jobs.filter(j=>j.t===t)}function head(title,sub,action=''){return `<div class="head"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}function card(j){return `<button class="card ${j.st==='completed'?'done':''}" onclick="selected='${j.id}';view='jobs';render()"><strong>${j.c}</strong><span>${j.s}</span><small>${j.time||'Unscheduled'} · ${j.a}</small></button>`}
function chrome(body){let side=nav.map(n=>`<button class="${view===n.toLowerCase()?'on':''}" onclick="go('${n.toLowerCase()}')">${n}</button>`).join('');return `<div class="top"><div class="brand"><b>PPT PEST</b><span>OPERATING SYSTEM</span></div><div class="top-right"><span>OWNER PREVIEW · LOCAL DEMO</span><select onchange="role=this.value;selected=null;render()">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${k===role?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="layout"><aside><small>OWNER PREVIEW</small>${side}<div style="margin-top:auto;font-size:9px;color:#666;padding:8px">Seeded sample data<br>No production records</div></aside><main>${body}</main></div><nav class="bottom">${['overview','dispatch','daily','jobs','reports'].map(n=>`<button class="${view===n?'on':''}" onclick="go('${n}')">${n==='overview'?'Home':n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</nav>`}function go(v){view=v;selected=null;render()}
function overview(){return chrome(`${head('PPT PEST OPERATING SYSTEM','OWNER PREVIEW · A shared field-operations system built around the 3-truck paper workflow.','<button class="primary" onclick="go(\'dispatch\')">Start Live Demo →</button>')}<section class="hero"><div><span class="eyebrow">BUILT AROUND HOW PPT ACTUALLY WORKS</span><h2>3 TRUCKS.<br>ONE LIVE SYSTEM.</h2><p>Schedule work once. Give each truck the right jobs. Capture service proof in the field. Bring it back to the office. Keep the familiar planners whenever paper is useful.</p><div class="jumps"><button onclick="go('dispatch')">3-Truck Dispatch</button><button onclick="go('monthly')">Planner Views</button><button onclick="go('reports')">Owner Reports</button></div></div><div class="diagram"><div class="office"><small>ONE OPERATING SPINE</small><b>OFFICE</b><span>Dispatch · Customers · Billing · Reports</span></div><div class="stem"></div><div class="trucks"><div><b>TRUCK 1</b><span>Own jobs + notes</span></div><div><b>TRUCK 2</b><span>Own jobs + notes</span></div><div><b>TRUCK 3</b><span>Own jobs + notes</span></div></div></div></section><div class="values"><div><b>3</b><span>TRUCK WORKSPACES</span></div><div><b>1</b><span>OFFICE DISPATCH BOARD</span></div><div><b>OFFLINE</b><span>FIELD-READY DESIGN</span></div><div><b>OPEN</b><span>SELF-HOSTED SOURCE</span></div></div><div class="features"><article><b>01</b><h3>Planner → App</h3><p>Daily hourly, Weekly job blocks and Monthly completion calendar preserve the current workflow.</p></article><article><b>02</b><h3>Full Job Record</h3><p>Treatments, materials, photos, signature, follow-up and billing status stay with the job.</p></article><article><b>03</b><h3>Works Offline</h3><p>The production build saves field changes locally first and synchronizes when connection returns.</p></article><article><b>04</b><h3>Owner Control</h3><p>Office keeps assignment and billing authority while each truck stays focused on its own work.</p></article></div>`)}
function dispatch(){let lane=(t,label)=>`<section class="lane"><header><span>${label}</span><span>${jobs.filter(j=>j.t===t).length}</span></header><div class="cards">${jobs.filter(j=>j.t===t).map(card).join('')||'<small>No jobs</small>'}</div></section>`;return chrome(`${head('Office Dispatch','All three trucks plus field-submitted work in one view.')}<div class="board">${lane(0,'REVIEW / UNSCHEDULED')}${lane(1,'TRUCK 1')}${lane(2,'TRUCK 2')}${lane(3,'TRUCK 3')}</div>`)}
function daily(){let t=role==='office'?1:+role.replace('truck',''),hours=['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];return chrome(`${head(`Truck ${t} Daily Planner`,'Hourly jobs + a large persistent notes area.')}<div class="daily"><div class="hours"><div class="label">HOURLY PLAN / JOBS</div>${hours.map(h=>`<div class="hour"><time>${h}</time><div>${jobs.filter(j=>j.t===t&&j.time===h).map(card).join('')||'<span style="display:block;border-bottom:1px solid #ccc;margin:16px 4px"></span>'}</div></div>`).join('')}</div><div class="notes"><div class="label">DAILY NOTES</div><textarea placeholder="Tap here and write notes…" oninput="localStorage.setItem('ppt-owner-notes',this.value)">${localStorage.getItem('ppt-owner-notes')||''}</textarea></div></div>`)}
function monthly(){let ds=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],cells=[];for(let i=0;i<35;i++){let d=i-1;cells.push(`<div class="day">${d>0&&d<=30?`<time>${d}</time>${d===9?jobs.filter(j=>j.t>0).map(j=>`<div class="mini ${j.st==='completed'?'done':''}">T${j.t} · ${j.c}</div>`).join(''):''}`:''}</div>`)}return chrome(`${head('September 2026 · Master Monthly','Jobs stay visible as they are completed; built to match the familiar paper calendar.')}<div class="monthwrap"><div class="weekdays">${ds.map(x=>`<b>${x}</b>`).join('')}</div><div class="month">${cells.join('')}</div></div><div class="panel" style="margin-top:0"><h2>MONTH NOTES / CARRYOVER</h2><textarea style="width:100%" placeholder="Owner / office carryover notes"></textarea></div>`)}
function jobdetail(j){return chrome(`${head(j.c,`${j.a} · ${j.s}`,'<button onclick="selected=null;render()">← Jobs</button>')}<div class="record"><section class="panel"><h2>SCHEDULE & ASSIGNMENT</h2><label>Date<input type="date" value="${today}"></label><label>Assigned Truck<select><option>Truck ${j.t||'Review'}</option></select></label><label>Status<select id="status"><option>${j.st.replaceAll('_',' ')}</option><option>completed</option></select></label></section><section class="panel"><h2>SERVICE SCOPE</h2><label>Service Type<input value="${j.s}"></label><label>Scope / Requested Work<textarea>Inspect and complete approved service scope.</textarea></label><label>Areas Treated<textarea></textarea></label></section><section class="panel"><h2>FIELD SERVICE RECORD</h2><label>Treatment Details<textarea></textarea></label><label>Materials / Products Used<textarea></textarea></label><label>Technician Completion Notes<textarea></textarea></label></section><section class="panel"><h2>PROOF & FOLLOW-UP</h2><label>Photos / Attachments<input type="file" accept="image/*" multiple></label><label>Customer Signature<input placeholder="Printed name"></label><label>Follow-up Date<input type="date"></label></section><section class="panel"><h2>BILLING</h2><label>Billing Status<select><option>Ready to Bill</option><option>Invoiced</option><option>Paid</option></select></label><label>Amount<input type="number" value="${j.amt}"></label></section><section class="panel"><h2>DEMO ACTION</h2><p style="font-size:12px;line-height:1.5">This owner preview stores only sample data in this browser. The production build uses role-protected synchronization.</p><button class="primary" onclick="jobs.find(x=>x.id==='${j.id}').st='completed';selected=null;view='dispatch';render()">Mark Sample Job Complete</button></section></div>`)}
function jobsview(){if(selected)return jobdetail(jobs.find(j=>j.id===selected));return chrome(`${head('Jobs','Open any sample job to inspect the field-service record.')}<div class="cards">${visible().map(card).join('')}</div>`)}function reports(){let v=visible(),done=v.filter(j=>j.st==='completed').length,total=v.reduce((a,j)=>a+j.amt,0);return chrome(`${head('Owner Reports','Simple operating visibility from the same job records.')}<div class="metrics"><div class="metric"><b>${v.filter(j=>j.st!=='completed').length}</b><span>OPEN JOBS</span></div><div class="metric"><b>${done}</b><span>COMPLETED</span></div><div class="metric"><b>${v.filter(j=>j.t===0).length}</b><span>REVIEW QUEUE</span></div><div class="metric"><b>$${total.toLocaleString()}</b><span>JOB VALUE</span></div></div><div class="truckstats">${[1,2,3].map(t=>{let a=jobs.filter(j=>j.t===t);return `<article><b>TRUCK ${t}</b><p>${a.length} jobs · ${a.filter(j=>j.st==='completed').length} complete</p></article>`}).join('')}</div>`)}
function render(){if(view==='overview')return A.innerHTML=overview();if(view==='dispatch')return A.innerHTML=dispatch();if(view==='daily')return A.innerHTML=daily();if(view==='monthly')return A.innerHTML=monthly();if(view==='jobs')return A.innerHTML=jobsview();if(view==='reports')return A.innerHTML=reports();A.innerHTML=overview()}render();</script></body></html>
